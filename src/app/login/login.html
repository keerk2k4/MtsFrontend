<div class="login-wrapper">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark">₹</div>
      <h1>Money Transfer System</h1>
      <p class="subtitle">Sign in to continue</p>
    </div>

    <div class="error-banner" *ngIf="error">
      <span>⚠️</span> {{ error }}
    </div>

    <form name="loginForm" (submit)="doLogin(); $event.preventDefault()" autocomplete="off">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" [(ngModel)]="username" placeholder="Enter your username" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="Enter your password" required />
      </div>

      <div class="field">
        <label for="accountId">Account ID</label>
        <input type="number" id="accountId" name="accountId" [(ngModel)]="accountId" placeholder="Enter your account ID" required />
      </div>

      <button type="submit" class="login-btn">Sign In</button>
    </form>

    <p class="footer-text">Secure banking platform</p>
  </div>
</div>
