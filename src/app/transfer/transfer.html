<div class="page-wrapper">
  <div class="card">
    <div class="card-header">
      <h1>Transfer Money</h1>
      <p>Send funds to another account</p>
    </div>

    <form #f="ngForm" novalidate>
      <div class="field">
        <label>From Account ID</label>
        <input type="text" name="fromId" [(ngModel)]="transferreq.fromId" class="readonly" readonly />
      </div>

      <div class="field">
        <label>To Account ID</label>
        <input type="number" name="toId" [(ngModel)]="transferreq.toId"
               placeholder="Enter recipient account ID" required min="1" />
      </div>

      <div class="field">
        <label>Amount (₹)</label>
        <input type="number" name="amount" [(ngModel)]="transferreq.amount"
               placeholder="Enter amount" required min="1" />
        <span class="hint">Maximum: ₹{{ MAX_AMOUNT | number }}</span>
      </div>

      <div class="same-acct-warn"
           *ngIf="transferreq.fromId && transferreq.toId && (+transferreq.fromId === +transferreq.toId)">
        Source and destination accounts must be different.
      </div>

      <button type="button" class="submit-btn" (click)="transferMoney()">
        Transfer
      </button>

      <div class="status-box success" *ngIf="isSuccess === true">{{ statusMessage }}</div>
      <div class="status-box error"   *ngIf="isSuccess === false">{{ statusMessage }}</div>

      <button type="button" class="back-btn" (click)="navigate()">Back to Dashboard</button>
    </form>
  </div>
</div>
